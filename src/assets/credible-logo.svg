<svg width="72" height="72" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueA" x1="95" y1="410" x2="360" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00377f"/>
      <stop offset="0.48" stop-color="#0069a8"/>
      <stop offset="1" stop-color="#21c8d8"/>
    </linearGradient>

    <linearGradient id="blueB" x1="155" y1="350" x2="420" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00377f"/>
      <stop offset="0.55" stop-color="#007db7"/>
      <stop offset="1" stop-color="#2bd7df"/>
    </linearGradient>

    <linearGradient id="darkSide" x1="110" y1="360" x2="250" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#002f73"/>
      <stop offset="1" stop-color="#005a99"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#00345f" flood-opacity="0.23"/>
    </filter>
  </defs>

  <!-- left bottom swoosh -->
  <path
    d="M112 250
       C72 303 82 362 139 385
       C167 397 202 392 236 371
       C195 346 169 310 165 265
       C149 299 130 317 106 314"
    fill="none"
    stroke="url(#darkSide)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <!-- shield outer -->
  <path
    d="M256 62
       C216 105 166 128 101 136
       V234
       C101 340 161 416 256 456
       C351 416 411 340 411 234
       V136
       C346 128 296 105 256 62Z"
    fill="none"
    stroke="url(#blueA)"
    stroke-width="36"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <!-- shield inner highlight -->
  <path
    d="M256 97
       C225 128 188 148 137 157
       V226
       C137 307 181 369 256 407
       C331 369 375 307 375 226
       V157
       C324 148 287 128 256 97Z"
    fill="none"
    stroke="#0fb8c9"
    stroke-width="13"
    stroke-linejoin="round"
    opacity="0.45"
  />

  <!-- check body -->
  <path
    d="M178 270
       L237 330
       C280 264 323 211 387 159
       C347 221 309 286 252 377
       L159 293Z"
    fill="url(#blueB)"
